name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'

      - run: flutter pub get

      - run: flutter analyze

      - name: Checkstyle (format + strict lints)
        run: bash tools/checkstyle.sh

      - name: Run tests (per-module summary, JUnit XML, coverage)
        run: bash tools/run_tests.sh

      - name: Check coverage against baseline
        run: bash tools/check_coverage.sh

      - name: Upload test reports and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/
            coverage/lcov.info

      - name: Append test summary to job summary
        if: always()
        run: |
          if [ -f build/reports/summary.md ]; then
            cat build/reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - run: flutter pub get

      - run: flutter build apk --debug

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Install Linux desktop build dependencies and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb

      - run: flutter pub get

      - name: Run integration tests (real Flutter engine, Linux desktop, virtual display)
        run: xvfb-run -a flutter test integration_test -d linux --reporter expanded
