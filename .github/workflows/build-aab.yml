name: Build Play Store bundle

# Builds the signed release app bundle (.aab) to upload to Google Play.
# Run manually: Actions -> "Build Play Store bundle" -> Run workflow.
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   BEACHIQ_KEYSTORE_BASE64    the upload keystore, base64-encoded (no line breaks)
#   BEACHIQ_KEYSTORE_PASSWORD  keystore password
#   BEACHIQ_KEY_ALIAS          key alias inside the keystore
#   BEACHIQ_KEY_PASSWORD       key password
# The .aab is attached to the run as the artifact "beachiq-release-aab".

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.BEACHIQ_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BEACHIQ_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BEACHIQ_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BEACHIQ_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret BEACHIQ_$name is not set"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BEACHIQ_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "BEACHIQ_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed app bundle
        env:
          BEACHIQ_KEYSTORE_PASSWORD: ${{ secrets.BEACHIQ_KEYSTORE_PASSWORD }}
          BEACHIQ_KEY_ALIAS: ${{ secrets.BEACHIQ_KEY_ALIAS }}
          BEACHIQ_KEY_PASSWORD: ${{ secrets.BEACHIQ_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build appbundle --release

      - name: Verify the bundle is signed with the upload key
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab \
            | grep -E "Owner|SHA256" || { echo "::error::Bundle has no signature"; exit 1; }
          if keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab \
              | grep -q "Android Debug"; then
            echo "::error::Bundle is signed with the debug key"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: beachiq-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
