name: Release

# Runs after a release PR ("Version YYYY.MM.N", develop -> main) is merged.
# Creates the git tag vYYYY.MM.N and a GitHub Release whose notes are the PR
# body, with a debug APK attached so the build can be installed on a phone.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to (re)release, e.g. 2026.10.3 (must match a merged "Version <x>" PR)'
        required: true

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and release notes from the merged release PR
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            PR_JSON=$(gh api "repos/$REPO/pulls?state=closed&base=main&per_page=50" \
              --jq "[.[] | select(.merged_at != null and .title == \"Version $INPUT_VERSION\")][0] // empty")
          else
            PR_JSON=$(gh api "repos/$REPO/commits/$SHA/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main" and (.title | test("^Version [0-9]{4}\\.[0-9]{2}\\.[0-9]+$")))][0] // empty')
          fi
          if [ -z "$PR_JSON" ]; then
            echo "No merged release PR for this commit; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(echo "$PR_JSON" | jq -r '.title | sub("^Version "; "")')
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$PR_JSON" | jq -r '.body // ""' > "$RUNNER_TEMP/notes.md"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.meta.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.meta.outputs.skip == 'false'
        with:
          channel: stable
          flutter-version: '3.32.2'
          cache: true

      - name: Build debug APK
        if: steps.meta.outputs.skip == 'false'
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Create tag and GitHub Release
        if: steps.meta.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/beachiq-$VERSION-debug.apk"
          cp build/app/outputs/flutter-apk/app-debug.apk "$APK"
          gh release create "v$VERSION" "$APK#BeachIQ debug APK ($VERSION)" \
            --target "$SHA" \
            --title "Version $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
